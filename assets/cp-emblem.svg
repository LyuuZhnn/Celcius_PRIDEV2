<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" fill="none">
  <defs>
    <linearGradient id="metal" x1="65" y1="45" x2="290" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".38" stop-color="#d9dadd"/><stop offset=".68" stop-color="#fff"/><stop offset="1" stop-color="#8b8e94"/>
    </linearGradient>
    <linearGradient id="crown" x1="158" y1="12" x2="208" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#aeb2b9"/>

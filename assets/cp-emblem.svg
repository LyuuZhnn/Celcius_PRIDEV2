    <path d="M299 123c36 23 49 48 34 65-18 22-68 20-128-5" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M60 123c33-26 80-37 121-29" stroke="#bfc2c8" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>
